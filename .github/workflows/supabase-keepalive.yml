# R63: one read request every third day so the free Supabase project never pauses.
# Needs the repository secrets SUPABASE_URL and SUPABASE_KEY. Prints only the HTTP status.
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 3 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "apikey: ${SUPABASE_KEY}" \
            "${SUPABASE_URL}/rest/v1/planners?select=id&limit=1")
          echo "Supabase responded with HTTP ${status}"
          test "${status}" = "200"
